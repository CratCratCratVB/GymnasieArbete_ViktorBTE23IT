<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="/client.js" defer></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background: #f2f2f2;
            color: #333;
        }

        #topField {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            gap: 10px;
        }

        #topField h1 {
            margin: 0;
            padding: 8px 14px;
            font-size: 32px;
            border-radius: 6px;
            background: #fafafa;
            border: 1px solid #ddd;
        }

        #topField a {
            font-size: 18px;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #ffffff;
            transition: 0.2s;
        }

        #topField a:hover {
            background: #eaeaea;
        }

        .register, .login, .createRoom, #roomsListBox {
            background: #ffffff;
            padding: 20px;
            margin: 20px auto;
            border-radius: 10px;
            border: 1px solid #ddd;
            max-width: 600px;
            width: 95%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .register h2, .login h2, .createRoom h2, #roomsListBox h2 {
            margin-top: 0;
        }

        form input, form button {
            max-width: 650px;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        form button {
            background: #4a8cff;
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        form button:hover {
            background: #3a6fd6;
        }

        #roomList {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        #roomList div {
            padding: 15px;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #ddd;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            transition: 0.2s;
        }

        #roomList div:hover{
            background: #f0f0f0;
            transform: translateY(-3px);
        }

        #chatHere, #chatB {
            margin: 20px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
            max-width: 800px;
            width: 95%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        #roomMessages {
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            border-radius: 6px;
            background: #fafafa;
            border: 1px solid #ddd;
        }

        .hidden {
            display: none;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        footer h2 {
            margin-bottom: 5px;
        }

        @media (max-width: 600px) {
        
            #topField {
                flex-direction: column;
                text-align: center;
            }
        
            #topField a {
                width: 95%;
                text-align: left;
            }
        
            #topField h1 {
                font-size: 28px;
            }
        
            form input, form button {
                font-size: 16px;
            }
        
            #roomMessages {
                max-height: 200px;
            }

            #roomsListBox {
                width: 85vw;
            }
        }

    </style>

    <!-- Mobile Hamburber Menu -->
    <script>
        function toggleMenu(){
            let nav = document.querySelector("#logOption");
            nav.classList.toggle("hidden")
        }

        function toggleCreateRoom(){
            document.getElementById("createRoomBtn").classList.toggle("hidden");
        }
        function toggleRoomsList(){
            document.getElementById("roomsListBox").classList.toggle("hidden");
            loadRooms();
        }

        show = id => {

            const logOptBox = document.getElementById(id);
            if(!logOptBox.classList.contains("hidden")){
                logOptBox.classList.add("hidden");
                return;
            }

            registerBox.classList.add("hidden"); 
            loginBox.classList.add("hidden");

            document.getElementById(id).classList.remove("hidden");
        };

        fetch("/auth_stats")
            .then(res => res.json())
            .then(data => {
                if (data.loggedIn){
                    document.getElementById("registerOpt").classList.add("hidden");
                    document.getElementById("loginOpt").classList.add("hidden");
                    document.getElementById("createRoomBtn").classList.add("hidden");
                    document.getElementById("rooms").classList.remove("hidden");
                    document.getElementById("createR").classList.remove("hidden");
                }
                else {
                    document.getElementById("registerOpt").classList.remove("hidden");
                    document.getElementById("loginOpt").classList.remove("hidden");
                    document.getElementById("logOut").classList.add("hidden");
                    document.getElementById("rooms").classList.add("hidden");
                    document.getElementById("createR").classList.add("hidden");
                    document.getElementById("createRoomBtn").classList.add("hidden");
                }
            });
    </script>
</head>


<body>

    <div id="topField">
        <h1>
            CratChat
        </h1>
        <a href="#" id="registerOpt" onclick="show('registerBox')">Register</a>
        <a href="#" id="loginOpt" onclick="show('loginBox')">Login</a>
        <a href="#" id="rooms" onclick="toggleRoomsList()">Rooms</a>
        <a href="#" id="createR" onclick="toggleCreateRoom()">Create Room</a>
        <a href="/logout" id="logOut">Logout</a>
    </div>

    <br>

    <div class="register hidden" id="registerBox">
        <h2>Register</h2>
        <form action="/register" id="logOption" method="post">
            <input type="username" autocomplete="off" name="username" placeholder="Username">
            <input type="email" autocomplete="off" name="email" placeholder="Email">
            <input type="password" autocomplete="off" name="password" placeholder="Password">
            <input type="submit" value="Register">
        </form>
    </div>

    <div class="login hidden" id="loginBox">
        <h2>Login</h2>
        <form action="/login" id="logOption" method="post">
            <input type="username" autocomplete="off" name="username" placeholder="Username">
            <input type="password" autocomplete="off" name="password" placeholder="Password">
            <input type="submit" value="Login">
        </form>
    </div>

    <div class="createRoom" id="createRoomBtn">
        <h2>Create a Room</h2>
        <form action="/createRoom" id="createRoomForm" method="post">
            <input name="roomName" type="text" id="roomNameInp" placeholder="Room Name: ">
            <button type="submit">Create</button>
        </form>
    </div>

    <div id="roomsListBox" class="hidden">
        <h2>Avaliable Rooms: </h2>
        <div id="roomList"></div>

    </div>

    
    <div id="chatHere" class="hidden">
        <div id="chatB">

            <div id="roomChatBox">
                <h2 id="roomTitle"></h2>

                <div id="roomMessages"></div>

                <form action="" id="roomMesForm" autocomplete="off">
                    <input name="roomMsg" type="text" placeholder="Enter message: " required>
                    <button type="submit">Send Message</button>
                </form>

                <button id="leaveRoomBtn">Leave Room</button>

            </div>


            <!-- Chat sender -->
            <form action="" autocomplete="off" id="mesForm" class="hidden">
                <input autocomplete="off" type="text" placeholder="Enter message: ">
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>

</body>

<footer>
    <div>
        <h2>Contact CratChat Mod-Team</h2>
        <h3>Phone-line: 076 558 27 75</h3>
        <h3>Email: modinfo@cratchat.com</h3>
    </div>
</footer>

</html>
