<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="/client.js" defer></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 5px;
            background: #f5f5f5;
        }

        #topField{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        #topField h1 {
            margin: 10;
            font-size: 35px;
        }

        #topField a{
            font-size: 25px;
            text-decoration: none;
            padding: 0.2%;
            border: 1px solid;
        }

        .register, .login {
            background: #ffffff;
            padding: 20px;
            margin: 20px auto;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        #chatB {
        margin: 30px auto;
        background: #ffffff;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #ccc;
        }

        .hidden{
            display: none;
        }

    </style>

    <!-- Mobile Hamburber Menu -->
    <script>
        function toggleMenu(){
            let nav = document.querySelector("#logOption");
            nav.classList.toggle("hidden")
        }

        show = id => {

            const logOptBox = document.getElementById(id);
            if(!logOptBox.classList.contains("hidden")){
                logOptBox.classList.add("hidden");
                return;
            }

            registerBox.classList.add("hidden"); 
            loginBox.classList.add("hidden");

            document.getElementById(id).classList.remove("hidden");
        };
    </script>
</head>


<body>

    <div id="topField">
        <h1>
            CratChat
        </h1>

        <a href="#" onclick="show('registerBox')">Register</a>
        <a href="#" onclick="show('loginBox')">Login</a>
        <a href="/logout">Logout</a>
    </div>

    <br>

    <div class="register hidden" id="registerBox">
        <h2>Register</h2>
        <form action="/register" id="logOption" method="post">
            <input type="username" autocomplete="off" name="username" placeholder="Username">
            <input type="email" autocomplete="off" name="email" placeholder="Email">
            <input type="password" autocomplete="off" name="password" placeholder="Password">
            <input type="submit" value="Register">
        </form>
    </div>

    <div class="login hidden" id="loginBox">
        <h2>Login</h2>
        <form action="/login" id="logOption" method="post">
            <input type="username" autocomplete="off" name="username" placeholder="Username">
            <input type="password" autocomplete="off" name="password" placeholder="Password">
            <input type="submit" value="Login">
        </form>
    </div>

    <br>

    <div id="chatB">
        <form action="" autocomplete="off" name="msg" id="mesForm">
            <input name="msg" autocomplete="off" type="text" placeholder="Enter message: ">
        </form>
    </div>
</body>

<footer>
    <div>
        <h2>Contact CratChat mod-team</h2>
        <h3>Phone-line: 076 558 27 75</h3>
        <h3>Email: modinfo  @cratchat.com</h3>
    </div>
</footer>

</html>
